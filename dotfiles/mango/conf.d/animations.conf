# ==============================================================================
# ANIMACIONES Y TRANSICIONES - POP & SCALE (CIERRE CORREGIDO)
# ==============================================================================
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
layerrule=animation_type_open:zoom,layer_name:launcher
layerrule=animation_type_close:zoom,layer_name:launcher

# Parámetros para zoom y opacidad
# La ventana se abre desde el 75% y al cerrarse encoge hasta el 50% para que el efecto sea notorio
zoom_initial_ratio=0.75
zoom_end_ratio=0.50
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0      # Empieza el fade-out completamente sólida

# Duraciones (ms)
animation_duration_move=500 
animation_duration_open=240
animation_duration_close=450   # Tiempo suficiente para apreciar la contracción
animation_duration_tag=550
animation_duration_focus=0

# Curvas de aceleración bézier
animation_curve_open=0.175,0.885,0.32,1.05
animation_curve_move=0.25,1,0.5,1
animation_curve_tag=0.25,1,0.5,1

# Curva de cierre dentro de rango normalizado (anticipación suave y colapso visible)
animation_curve_close=0.4,0.0,0.2,1.0
animation_curve_focus=0.25,1,0.5,1
animation_curve_opafadeout=0.4,0.0,0.2,1.0
animation_curve_opafadein=0.25,1,0.5,1